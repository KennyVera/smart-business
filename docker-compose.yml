services:
  db:
    image: postgres:18-alpine
    container_name: smart_business_postgres
    restart: always
    environment:
      POSTGRES_DB: smart_business_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgreAdmin19
    ports:
      - "5434:5432"
    volumes:
      # PG 18+ usa /var/lib/postgresql (no .../data) para el volumen persistente.
      - postgres_data:/var/lib/postgresql
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_business_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgreAdmin19
      POSTGRES_DB: smart_business_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ImagenesProductos:/app/ImagenesProductos
    command:
      [
        "sh",
        "-c",
        "python esperar_postgres.py && python manage.py runserver 0.0.0.0:8000",
      ]

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"

volumes:
  postgres_data:
